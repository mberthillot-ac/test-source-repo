schedules: # https://stackoverflow.com/a/78365628
- cron: 0 0,6,12,18 * * *
  displayName: Trigger every 6 hours
  branches:
    include: 
    - main
 
  always: true 
 
trigger:
- none
 
pool:
  vmImage: windows-latest
steps:
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      git remote add github https://github.com/mberthillot-ac/test-source-repo.git
      git fetch github
      git checkout -b github-main github/main

      # write-host ("Cloning...")
      # git clone --mirror https://github.com/mberthillot-ac/test-source-repo.git
      # write-host ("Opening cloned directory...")
      # cd $(build.sourcesdirectory)/test-source-repo.git
      # write-host ("Opening cloned directory...")
      # git remote add origin1 https://$(System.AccessToken)@dev.azure.com/AbsysCyborgDevOps/ABSYS_CYBORG.LeStudio.KB/_git/test-source-repo
      # git push -u origin1  --all
  env:
    AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
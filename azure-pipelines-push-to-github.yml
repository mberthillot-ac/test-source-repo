schedules: # Sources : https://stackoverflow.com/a/78365628 + Copilot
- cron: 0 0 * * *
  displayName: Tous les jours à minuit
  branches:
    include: 
    - main
  always: true 
 
trigger:
- none
 
pool:
  vmImage: windows-latest
steps:
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      $githubUrl = 'https://github.com/mberthillot-ac/test-source-repo.git'
      $devopsUrl = ('https://' + $env:AZURE_DEVOPS_EXT_PAT + '@dev.azure.com/AbsysCyborgDevOps/ABSYS_CYBORG.LeStudio.KB/_git/test-source-repo')

      git remote add github $githubUrl
      git fetch github
      git checkout -b github-main github/main
      git remote add devops $devopsUrl
      git push devops github-main
  env:
    #AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
    AZURE_DEVOPS_EXT_PAT: 'FKKtUxDNwckolcYpCd1B0Sywb1jO3T6G1nlEyCTHj6ryOOKBwaMhJQQJ99BDACAAAAAmRzqtAAASAZDO41iD'